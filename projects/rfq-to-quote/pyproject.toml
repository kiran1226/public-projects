[project]
name = "rfq2quote"
version = "0.1.0"
description = "RFQ-to-quote agent: turns messy inbound requests for quotation into reviewed draft quotes"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "anthropic",
    "openpyxl>=3.1",
    "pydantic>=2.7",
    "pypdf>=4.0",
    "python-dotenv>=1.2.4",
    "typer>=0.12",
]

[project.optional-dependencies]
ui = ["streamlit>=1.37", "pandas>=2.0"]

[project.scripts]
rfq2quote = "rfq2quote.cli:app"

[dependency-groups]
dev = [
    "fpdf2>=2.7",
    "matplotlib>=3.8",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rfq2quote"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts", "app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Hand-written datasets and layout tables read better as one row per line.
"scripts/*" = ["E501"]
"tests/*" = ["E501"]
