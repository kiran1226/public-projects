[project]
name = "amlagent"
version = "0.1.0"
description = "AML alert investigation agent: tiered models, pseudonymised data, cited dispositions"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "anthropic",
    "pydantic>=2.7",
    "python-dotenv>=1.2.4",
    "typer>=0.12",
]

[project.optional-dependencies]
ui = ["streamlit>=1.37", "pandas>=2.0"]
nim = ["openai>=1.40"]

[project.scripts]
aml-agent = "amlagent.cli:app"

[dependency-groups]
dev = ["matplotlib>=3.8", "pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amlagent"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts", "app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]
"tests/*" = ["E501"]
# Prompts read better as unwrapped sentences.
"src/amlagent/roles.py" = ["E501"]
"src/amlagent/workers.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
