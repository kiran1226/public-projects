<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tender radar scoreboard</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1b1d21; --muted: #62676f; --line: #e2dfd7;
    --accent: #1f5f8b; --good: #1d7a4c; --bad: #b3261e; --bar: #c9dcea; --bar-strong: #1f5f8b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --panel: #1c1f25; --ink: #e9e7e1; --muted: #9aa0a8; --line: #2c3038;
      --accent: #7fb6dc; --good: #63c796; --bad: #f08a80; --bar: #2a3d4d; --bar-strong: #7fb6dc;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 1060px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: -0.01em; }
  h2 { font-size: 19px; margin: 40px 0 6px; }
  p { margin: 6px 0; }
  .muted { color: var(--muted); }
  .small { font-size: 14px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-top: 20px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .tile .label { font-size: 13px; color: var(--muted); }
  .tile .value { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .tile .note { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .status { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
  .ok .dot { background: var(--good); } .fail .dot { background: var(--bad); }
  .ok { color: var(--good); } .fail { color: var(--bad); }
  .scroll { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-top: 10px; }
  table { border-collapse: collapse; width: 100%; font-size: 14.5px; font-variant-numeric: tabular-nums; }
  th, td { padding: 9px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; white-space: normal; min-width: 190px; }
  th { font-size: 12.5px; font-weight: 600; color: var(--muted); }
  tr:last-child td { border-bottom: 0; }
  tr.lead td:first-child { font-weight: 650; }
  .share { display: inline-block; min-width: 40px; }
  .bar { display: inline-block; height: 8px; border-radius: 4px; background: var(--bar); vertical-align: middle; margin-left: 6px; width: 46px; position: relative; overflow: hidden; }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--bar-strong); }
  ul.checks { list-style: none; padding: 0; margin: 10px 0 0; }
  ul.checks li { padding: 6px 0; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: baseline; }
  ul.checks li:last-child { border-bottom: 0; }
  footer { margin-top: 48px; font-size: 13px; color: var(--muted); }
  code { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
</style>
</head>
<body>
<main>
  <h1>Tender radar</h1>
  <p class="muted">A daily shortlist of EU public tenders, scored against who went on to win them.</p>
  <div id="app"></div>
  <footer id="foot"></footer>
</main>
<script id="data" type="application/json">/*SCOREBOARD_DATA*/null</script>
<script>
(function () {
  var board = JSON.parse(document.getElementById("data").textContent);
  var app = document.getElementById("app");
  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === "text") node.textContent = attrs[k]; else node.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) node.appendChild(c); });
    return node;
  }
  function money(x) { return "US$" + Number(x || 0).toFixed(2); }
  function tile(label, value, note) {
    return el("div", { class: "tile" }, [
      el("div", { class: "label", text: label }),
      el("div", { class: "value", text: String(value) }),
      note ? el("div", { class: "note", text: note }) : null
    ]);
  }
  function shareCell(found, total) {
    var td = el("td");
    var pct = total ? Math.round(100 * found / total) : 0;
    td.appendChild(el("span", { class: "share", text: found + " (" + pct + "%)" }));
    var bar = el("span", { class: "bar" }); var fill = el("i"); fill.style.width = pct + "%";
    bar.appendChild(fill); td.appendChild(bar);
    return td;
  }
  function scoreTable(rows) {
    var head = ["Ranker", "Later won", "In top 1", "In top 3", "In top 5", "Median place", "Never listed", "Removed by a rule"];
    var table = el("table");
    table.appendChild(el("tr", {}, head.map(function (h) { return el("th", { text: h }); })));
    rows.forEach(function (r) {
      var tr = el("tr", r.ranker.indexOf("fused") === 0 ? { class: "lead" } : {});
      tr.appendChild(el("td", { text: r.label }));
      tr.appendChild(el("td", { text: String(r.outcomes) }));
      tr.appendChild(shareCell(r.top1, r.outcomes));
      tr.appendChild(shareCell(r.top3, r.outcomes));
      tr.appendChild(shareCell(r.top5, r.outcomes));
      tr.appendChild(el("td", { text: r.median_place == null ? "n/a" : String(r.median_place) }));
      tr.appendChild(el("td", { text: String(r.never_listed) }));
      tr.appendChild(el("td", { text: String(r.removed_by_rule) }));
      table.appendChild(tr);
    });
    return el("div", { class: "scroll" }, [table]);
  }
  function section(title, lead) {
    app.appendChild(el("h2", { text: title }));
    if (lead) app.appendChild(el("p", { class: "muted small", text: lead }));
  }
  if (!board) { app.appendChild(el("p", { text: "No scoreboard data was embedded in this page." })); return; }

  var live = board.live, back = board.backtest, cost = board.cost, health = board.health;
  var status = el("p", { class: "status " + (health ? (health.ok ? "ok" : "fail") : "") }, [
    el("span", { class: "dot" }),
    el("span", { text: health ? (health.ok ? "Feed healthy" : "Feed check failed") : "Feed health not recorded" })
  ]);
  app.appendChild(status);

  var tiles = el("div", { class: "tiles" });
  tiles.appendChild(tile("Live since", live.since || "not started", live.last_day ? "tenders published " + live.first_day + " to " + live.last_day : null));
  tiles.appendChild(tile("Publication days", live.days, live.lists + " lists written"));
  tiles.appendChild(tile("Tenders listed", live.tenders_listed, "for " + (back.meta.panel || 0) + " real suppliers and one client"));
  tiles.appendChild(tile("Outcomes scored", live.outcomes_scored, live.outcomes_arrived + " arrived; awards follow tenders by about four months"));
  tiles.appendChild(tile("Model spend today", money(cost.today_usd), "cap " + money(cost.cap_usd_per_day) + " a day; " + money(cost.last_30_days_usd) + " in 30 days"));
  app.appendChild(tiles);

  section("Live predictions", "Lists written before the outcome was known. A list is scored when an award names the winner.");
  if (live.scores.length) app.appendChild(scoreTable(live.scores));
  else app.appendChild(el("p", { text: live.since ? "No live prediction has an outcome yet. Awards follow tenders by about four months, so the first are expected about four months after " + live.since + "." : "The live run has not started." }));

  section("Backtest, held-out month", "Tenders first published from " + back.held_out_start + ". Not looked at while settings were chosen, scored once.");
  if (back.held_out.length) app.appendChild(scoreTable(back.held_out)); else app.appendChild(el("p", { text: "Not scored yet." }));

  section("Backtest, development months", "Tenders first published from " + (back.meta.cut || "") + " to the day before " + back.held_out_start + ". Ranker settings were chosen here.");
  if (back.development.length) app.appendChild(scoreTable(back.development));

  if (back.model && back.model.assessments) {
    var skippedIn = function (rows) {
      var row = rows.filter(function (r) { return r.ranker === "fused+model"; })[0];
      return row ? row.skipped_by_model + " of " + row.outcomes : "n/a";
    };
    var keep = function (rows) {
      return rows.filter(function (r) { return ["alert", "fused", "fused+model"].indexOf(r.ranker) >= 0; });
    };
    section("The model, on a sample: held-out month", back.model.assessments + " assessments on " + back.model.lists + " lists for " + money(back.model.cost_usd) + " over both samples. Every ranker is scored on the same supplier-days.");
    if (back.model_sample_held_out.length) app.appendChild(scoreTable(keep(back.model_sample_held_out))); else app.appendChild(el("p", { text: "Not scored yet." }));
    section("The model, on a sample: development months", null);
    app.appendChild(scoreTable(keep(back.model_sample_development)));
    app.appendChild(el("p", { class: "small muted", text: "Won tenders the model marked skip: " + skippedIn(back.model_sample_held_out) + " in the held-out month, " + skippedIn(back.model_sample_development) + " in the development months. Decisions sent to a person because the quoted passage was not in the notice: " + back.model.downgraded + ". Conditions dropped for the same reason: " + back.model.conditions_dropped + " of " + (back.model.conditions_dropped + back.model.conditions_kept) + "." }));
  }

  if (health) {
    section("Feed health", "Checked " + health.checked_at + ".");
    var list = el("ul", { class: "checks" });
    health.checks.forEach(function (c) {
      list.appendChild(el("li", {}, [
        el("span", { class: "status " + (c.ok ? "ok" : "fail") }, [el("span", { class: "dot" })]),
        el("span", {}, [el("strong", { text: c.name.replace(/_/g, " ") }), document.createTextNode(": " + c.detail)])
      ]));
    });
    app.appendChild(list);
  }

  document.getElementById("foot").textContent =
    "Generated " + board.generated_at + " from the prediction log and the outcome log. " +
    "Winners are the only outcome on record, so these figures understate how useful a list is. " +
    "Source data: TED, the EU's public procurement journal.";
})();
</script>
</body>
</html>
