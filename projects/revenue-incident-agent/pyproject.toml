[project]
name = "revwatch"
version = "0.1.0"
description = "Revenue incident agent: detects anomalies in e-commerce metrics, investigates them and proposes mitigations for human approval"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "anthropic>=2.9.0",
    "duckdb>=1.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.2",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "threadpoolctl>=3.1",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.scripts]
revwatch = "revwatch.cli:app"

[project.optional-dependencies]
ui = [
    "streamlit>=1.37",
]

[dependency-groups]
dev = [
    "matplotlib>=3.8",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pytest>=8.0",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revwatch", "src/mock_admin"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "app", "scripts"]
# Documents carry code samples that are not part of the package.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["revwatch", "mock_admin", "tests"]

[tool.ruff.lint.per-file-ignores]
# Hand-built scenarios and fixtures read better as one row per line.
"tests/*" = ["E501"]
# Diagram layout tables read better as one row per line.
"scripts/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # lets test files import shared helpers as `tests.conftest`, `tests.helpers`

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*", "duckdb.*", "threadpoolctl.*", "anthropic.*", "dotenv.*"]
ignore_missing_imports = true
